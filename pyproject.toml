# The distribution is `scrubmeta`; its import package is mapped onto src/scrub, so
# `pip install .` gives `import scrubmeta` and the `scrubmeta` command, while a checkout
# keeps running as `python -m src.scrub` and the tests keep importing `src.scrub`.
# Below the packaging tables is configuration for pytest, ruff and coverage.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scrubmeta"
description = "Irreversibly remove hidden metadata from files of any common type"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mohammad Ghorayeb" }]
dynamic = ["version", "dependencies"]
keywords = ["metadata", "privacy", "exif", "anonymization"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Repository = "https://github.com/MohammadGhorayeb/meta-data-manager"

[project.scripts]
scrubmeta = "scrubmeta.cli:main"

[tool.setuptools]
# Listed, not discovered: `find` cannot rename a root package. test_packaging.py fails
# if a new directory under src/scrub is missing here.
packages = [
    "scrubmeta",
    "scrubmeta.formats",
    "scrubmeta.formats.bmp",
    "scrubmeta.formats.docx",
    "scrubmeta.formats.epub",
    "scrubmeta.formats.exe",
    "scrubmeta.formats.flac",
    "scrubmeta.formats.gif",
    "scrubmeta.formats.heic",
    "scrubmeta.formats.jpeg",
    "scrubmeta.formats.m4a",
    "scrubmeta.formats.metafile",
    "scrubmeta.formats.mp3",
    "scrubmeta.formats.mp4",
    "scrubmeta.formats.ooxml",
    "scrubmeta.formats.pdf",
    "scrubmeta.formats.png",
    "scrubmeta.formats.pptx",
    "scrubmeta.formats.raw",
    "scrubmeta.formats.svg",
    "scrubmeta.formats.tiff",
    "scrubmeta.formats.webp",
    "scrubmeta.formats.xlsx",
    "scrubmeta.formats.zip",
    "scrubmeta.standards",
]

[tool.setuptools.package-dir]
scrubmeta = "src/scrub"

[tool.setuptools.dynamic]
version = { attr = "scrubmeta.__version__" }
dependencies = { file = ["requirements.txt"] }

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

# -ra              summary of everything non-passing, incl. WHY a test skipped.
#                  Skips are load-bearing here (jpegtran / ffmpeg / lame /
#                  shineenc gate whole modules), so a silent skip must never
#                  read as a pass.
# --strict-markers unknown @pytest.mark.* becomes an error, not a silent no-op.
# --strict-config  a typo in this file becomes an error, not a silent default.
# --durations      feeds the "slowest checks" table in the QA report.
addopts = "-ra --strict-markers --strict-config --durations=10"
xfail_strict = true

filterwarnings = [
    # Pillow emits this on the multi-picture JPEGs the torture corpus builds.
    # Individual tests already carry this filter; centralising it means new
    # tests do not have to rediscover it.
    "ignore:.*malformed MPO.*:UserWarning",
]

# --------------------------------------------------------------------------- #
# ruff (lint + import sorting + formatting)
# --------------------------------------------------------------------------- #
[tool.ruff]
# The matrix floor. numpy/scipy/PyWavelets all require >=3.11, so 3.11 is the
# oldest interpreter this project can physically run on.
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "scratch_*", "docs/_md2html.py"]

[tool.ruff.lint]
# E4/E7/E9 import+statement+syntax errors, F pyflakes, B bugbear (real bug
# shapes), UP pyupgrade (keeps syntax current with target-version), I isort.
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]

ignore = [
    # Guard clauses are written on one line throughout this codebase
    # (`if not data: return None`). That is a deliberate, consistent style, not
    # an accident, and reflowing ~27 of them would be churn with no reader win.
    "E701",  # multiple-statements-on-one-line (colon)
    "E702",  # multiple-statements-on-one-line (semicolon)

    # E741 flags `l`, `I` and `O` as ambiguous. In this codebase `L` is the
    # walked layout object (`L = walker.walk(data)`) and `I` appears in
    # IFD/ICC parsing. These are domain names, and renaming them would make the
    # format code read less like the specs it implements.
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# Every script re-roots sys.path so it can be run directly from the repo root
# (`sys.path.insert(0, REPO)`), which necessarily precedes the project imports.
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "scripts"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
source = ["src"]
branch = true
# Each CI matrix leg writes its own .coverage.<py> file; the coverage job
# combines them, so a branch only reachable on one interpreter still counts.
parallel = true
# Store paths relative to the repo root so data files combine cleanly no matter
# which runner or checkout directory produced them.
relative_files = true

[tool.coverage.paths]
source = ["src/", "*/meta-data-manager/src/"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
# Deliberately 0 here: `coverage report` measures the whole tree, and the whole
# tree legitimately sags whenever a new format lands as scaffolding before its
# tests. Gating on that number would turn CI red for doing the work in the right
# order, and each fix would nudge the floor down until it meant nothing.
#
# The real gate is scripts/coverage_gate.py, which holds *tested* code to a
# floor that does not move when untested scaffolding appears, and reports the
# untouched files by name instead of hiding them. See the coverage job.
fail_under = 0
