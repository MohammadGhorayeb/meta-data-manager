name: CI

# Every push to main and every pull request gets: a code-quality check, the full
# test suite on all four supported Python versions, a coverage gate, a re-run of
# the project's published measurements, and — the point of the whole thing — a
# plain-language quality report on the run page that a non-technical reader can
# actually understand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull-request run is free. Cancelling a main-branch run would
  # lose the published record of what that commit actually measured.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; only the report job is granted anything more.
permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHON_DEFAULT: "3.14"

jobs:
  # ------------------------------------------------------------------ #
  # 1. Code quality — the code itself, and this workflow file.
  # ------------------------------------------------------------------ #
  lint:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start the clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            tests/harness/requirements.txt

      - name: Install ruff
        run: python -m pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      # --output-format=github turns each finding into an inline annotation on
      # the offending line of the pull-request diff.
      - name: Lint the Python code
        id: ruff
        continue-on-error: true
        run: ruff check --output-format=github .

      - name: Lint again, machine-readable for the report
        if: always()
        run: ruff check --output-format=json --output-file ruff.json . || true

      # Report-only, deliberately. 85 of 114 files predate any formatter, so
      # gating this would demand a reformat commit touching nearly the whole
      # repository — that is a separate, human decision, not CI's to force.
      - name: Formatting drift (informational)
        if: always()
        continue-on-error: true
        run: |
          ruff format --check . \
            || echo "::notice::Some files differ from ruff format. Not a failure."

      # Lints this very file — bad expressions, undefined `needs`, unknown keys,
      # and shellcheck over every run block. Pinned image, so the check cannot
      # change underneath us.
      - name: Lint the workflow files
        if: always()
        run: |
          set -o pipefail
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.12 -oneline -no-color \
            | tee actionlint.txt \
            | awk -F: 'NF>3 {
                  f=$1; l=$2; c=$3;
                  msg=$0;
                  for (i = 0; i < 3; i++) msg = substr(msg, index(msg, ":") + 1);
                  sub(/^ +/, "", msg);
                  printf "::error file=%s,line=%s,col=%s::%s\n", f, l, c, msg
                }'
          echo "Workflow files are valid."

      - name: Stop the clock
        if: always()
        run: |
          mkdir -p timing
          printf '{"job":"lint","seconds":%s}\n' "$(($(date +%s) - JOB_START))" \
            > timing/lint.json

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: |
            ruff.json
            actionlint.txt
            timing/
          if-no-files-found: warn
          retention-days: 14

      - name: Gate
        if: always() && steps.ruff.outcome == 'failure'
        run: |
          echo "::error::Code-quality check failed. See the annotations above."
          exit 1

  # ------------------------------------------------------------------ #
  # 2. Test suite — every supported Python version.
  # ------------------------------------------------------------------ #
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One version failing must not hide the others: knowing whether a break is
      # version-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        # Floor and ceiling, not every version in between. 3.11 is the floor for a
        # hard reason: numpy, scipy and PyWavelets all declare requires-python
        # >=3.11, so 3.10 cannot install from wheels at all. 3.14 is the newest, and
        # is where a deprecation lands first.
        #
        # The middle versions were dropped after they earned nothing: across the runs
        # to date, every failure reproduced identically on all four legs (the last one
        # was `1 failed, 237 passed, 4 skipped` four times over). The real variation in
        # this project is the EXTERNAL toolchain — ffmpeg and lame differ between
        # macOS and Ubuntu, and that is what actually broke a claim — not the Python
        # minor version. Two legs cover the wheel-availability and syntax boundaries
        # where version breakage genuinely shows up, at half the wall-clock.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            tests/harness/requirements.txt

      # External binaries the scrubber and harness shell out to. They are never
      # linked in, so their licences do not bind the shipped tool.
      #   exiftool          ground-truth metadata extractor
      #   jpegtran          lossless JPEG repack (F2)
      #   ffmpeg + lame     MP3 decode and canonical re-encode (F3)
      # Tests needing a missing tool skip cleanly, so a silent failure here
      # would weaken the suite rather than break it. Hence: no `|| true`.
      - name: Install external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libimage-exiftool-perl libjpeg-turbo-progs ffmpeg lame poppler-utils

      # A SECOND MP3 engine, built rather than installed because no distribution
      # packages one. Every LAME front-end shares a single engine, so without shine
      # the cross-engine A2 experiments (E-LAME, E-ENGINE) skip -- the project's
      # headline audio claim would go unverified while the suite still reported
      # green. Small C project; no autotools needed.
      - name: Build shineenc (second MP3 engine, for the cross-engine A2 evidence)
        run: |
          git clone --depth 1 https://github.com/toots/shine.git /tmp/shine
          cc -O2 -I/tmp/shine/src/lib -I/tmp/shine/src/bin \
             /tmp/shine/src/lib/*.c /tmp/shine/src/bin/*.c \
             -o /tmp/shine/shineenc -lm
          sudo install -m 0755 /tmp/shine/shineenc /usr/local/bin/shineenc
          shineenc -h 2>&1 | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Record the exact tool versions used
        run: |
          {
            echo "<details><summary>Environment — Python ${{ matrix.python-version }}</summary>"
            echo
            echo '| Tool | Version |'
            echo '|---|---|'
            echo "| Python | $(python -V 2>&1 | cut -d' ' -f2) |"
            echo "| ExifTool | $(exiftool -ver) |"
            echo "| ffmpeg | $(ffmpeg -version | head -1 | cut -d' ' -f3) |"
            echo "| LAME | $(lame --version | head -1 | sed 's/.*version //; s/ .*//') |"
            echo "| poppler | $(pdftoppm -v 2>&1 | head -1 | sed 's/.*version //') |"
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error so the report is still built and published when tests
      # fail — people need to SEE what broke. The `ci` job turns the run red.
      - name: Run the test suite
        id: pytest
        continue-on-error: true
        env:
          # Each version writes its own data file; the coverage job combines them.
          COVERAGE_FILE: .coverage.${{ matrix.python-version }}
        run: |
          start=$(date +%s)
          status=0
          python -m pytest \
            --junit-xml="pytest-results-${{ matrix.python-version }}.xml" \
            --cov --cov-report= || status=$?
          mkdir -p timing
          printf '{"job":"test-%s","seconds":%s}\n' \
            "${{ matrix.python-version }}" "$(($(date +%s) - start))" \
            > "timing/test-${{ matrix.python-version }}.json"
          exit "$status"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.python-version }}
          path: |
            pytest-results-${{ matrix.python-version }}.xml
            timing/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: .coverage.${{ matrix.python-version }}
          # Coverage data files begin with a dot, and upload-artifact skips
          # hidden files by default. Without this the coverage job finds nothing.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Gate
        if: always() && steps.pytest.outcome == 'failure'
        run: |
          echo "::error::Tests failed on Python ${{ matrix.python-version }}."
          exit 1

  # ------------------------------------------------------------------ #
  # 3. Coverage — combine every version's data, then gate.
  # ------------------------------------------------------------------ #
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    if: always()
    steps:
      - name: Start the clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install coverage
        run: python -m pip install "$(grep -E '^coverage' requirements-dev.txt)"

      - name: Download coverage data from every Python version
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: covdata

      - name: Combine and report
        id: cov
        run: |
          shopt -s nullglob dotglob
          files=(covdata/.coverage.*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No coverage data was produced — every test leg failed before pytest could run."
            exit 1
          fi
          cp "${files[@]}" .
          python -m coverage combine
          python -m coverage json -o coverage.json
          python -m coverage xml -o coverage.xml
          python -m coverage html -d htmlcov
          python -m coverage report --format=markdown > coverage-table.md
          pct=$(python -c "import json; print(f\"{json.load(open('coverage.json'))['totals']['percent_covered']:.1f}\")")
          echo "percent=$pct" >> "$GITHUB_OUTPUT"
          mkdir -p timing
          printf '{"job":"coverage","seconds":%s}\n' \
            "$(($(date +%s) - JOB_START))" > timing/coverage.json

      # Gates the coverage of code the tests actually reach, and names every
      # file nothing reaches. A single whole-tree floor would go red each time a
      # new format lands as scaffolding, and would be ratcheted down until it
      # meant nothing — see the script's docstring for the full reasoning.
      #
      # --floor is the one number to tune. Measured history, kept here so the
      # bar is never quietly eroded:
      #   86%  JPEG + PNG + MP3
      #   85%  + FLAC
      #   84%  + M4A
      # Note what did NOT happen: while FLAC and M4A were mid-implementation the
      # whole-tree number dipped to 70%, but the floor never had to move —
      # untested scaffolding sits outside the gate by design, and the number
      # came back on its own once the tests landed.
      - name: Check coverage
        id: gate
        continue-on-error: true
        run: |
          python scripts/coverage_gate.py \
            --coverage-json coverage.json \
            --floor 82 \
            --out coverage-gate.json

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.xml
            coverage-gate.json
            coverage-table.md
            htmlcov/
            timing/
          if-no-files-found: warn
          retention-days: 14

      # Separate from the check itself, so the reports upload either way.
      - name: Gate
        if: always() && steps.gate.outcome == 'failure'
        run: |
          echo "::error::Coverage gate failed — see the annotations above."
          exit 1

  # ------------------------------------------------------------------ #
  # 4. Evidence — are this project's published claims still true?
  # ------------------------------------------------------------------ #
  evidence:
    name: Published results still true
    runs-on: ubuntu-latest
    # Raised from 20 when Phase 3 landed: rebuilding the PDF matrix now renders a
    # multi-document peer corpus through every available producer and runs
    # E-PDF-RASTER over it, which is minutes of work this job did not have before.
    timeout-minutes: 35
    steps:
      - name: Start the clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            tests/harness/requirements.txt

      - name: Install external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libimage-exiftool-perl libjpeg-turbo-progs ffmpeg lame poppler-utils

      # A SECOND MP3 engine, built rather than installed because no distribution
      # packages one. Every LAME front-end shares a single engine, so without shine
      # the cross-engine A2 experiments (E-LAME, E-ENGINE) skip -- the project's
      # headline audio claim would go unverified while the suite still reported
      # green. Small C project; no autotools needed.
      - name: Build shineenc (second MP3 engine, for the cross-engine A2 evidence)
        run: |
          git clone --depth 1 https://github.com/toots/shine.git /tmp/shine
          cc -O2 -I/tmp/shine/src/lib -I/tmp/shine/src/bin \
             /tmp/shine/src/lib/*.c /tmp/shine/src/bin/*.c \
             -o /tmp/shine/shineenc -lm
          sudo install -m 0755 /tmp/shine/shineenc /usr/local/bin/shineenc
          shineenc -h 2>&1 | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Re-measure, and compare against the published matrices
        id: evidence
        continue-on-error: true
        run: |
          status=0
          python scripts/check_evidence.py --out evidence.json || status=$?
          mkdir -p timing
          printf '{"job":"evidence","seconds":%s}\n' \
            "$(($(date +%s) - JOB_START))" > timing/evidence.json
          exit "$status"

      - name: Upload the evidence result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-result
          path: |
            evidence.json
            timing/
          if-no-files-found: warn
          retention-days: 14

      - name: Gate
        if: always() && steps.evidence.outcome == 'failure'
        run: |
          echo "::error::A published result no longer matches what this run measured. Regenerate the matrices, or fix the regression."
          exit 1

  # ------------------------------------------------------------------ #
  # 5. Report — the deliverable. Always runs, especially on failure.
  # ------------------------------------------------------------------ #
  report:
    name: QA report
    runs-on: ubuntu-latest
    # See the evidence job: the same PDF matrix rebuild happens here.
    timeout-minutes: 30
    needs: [lint, test, coverage, evidence]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            tests/harness/requirements.txt

      - name: Install external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libimage-exiftool-perl libjpeg-turbo-progs ffmpeg lame poppler-utils

      # A SECOND MP3 engine, built rather than installed because no distribution
      # packages one. Every LAME front-end shares a single engine, so without shine
      # the cross-engine A2 experiments (E-LAME, E-ENGINE) skip -- the project's
      # headline audio claim would go unverified while the suite still reported
      # green. Small C project; no autotools needed.
      - name: Build shineenc (second MP3 engine, for the cross-engine A2 evidence)
        run: |
          git clone --depth 1 https://github.com/toots/shine.git /tmp/shine
          cc -O2 -I/tmp/shine/src/lib -I/tmp/shine/src/bin \
             /tmp/shine/src/lib/*.c /tmp/shine/src/bin/*.c \
             -o /tmp/shine/shineenc -lm
          sudo install -m 0755 /tmp/shine/shineenc /usr/local/bin/shineenc
          shineenc -h 2>&1 | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Collect every job's artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Lay the artifacts out for the report builder
        run: |
          mkdir -p junit timing
          # Keep the version in the path: the builder recovers which Python
          # version produced each result from it.
          for d in artifacts/junit-*; do
            [ -d "$d" ] || continue
            ver="${d##*junit-}"
            mkdir -p "junit/$ver"
            find "$d" -name '*.xml' -exec cp {} "junit/$ver/" \;
          done
          find artifacts -path '*/timing/*.json' -exec cp {} timing/ \;
          for f in coverage.json coverage-gate.json ruff.json evidence.json; do
            found=$(find artifacts -name "$f" -print -quit)
            if [ -n "$found" ]; then cp "$found" "$f"; fi
          done
          echo "--- collected ---"
          ls -R junit timing || true

      - name: Build the report
        run: |
          python scripts/qa_report.py \
            --junit junit \
            --coverage-json coverage.json \
            --coverage-gate-json coverage-gate.json \
            --lint-json ruff.json \
            --evidence-json evidence.json \
            --timing-dir timing \
            --expect-legs "3.11,3.12,3.13,3.14" \
            --stage "lint=${{ needs.lint.result }}" \
            --stage "test=${{ needs.test.result }}" \
            --stage "coverage=${{ needs.coverage.result }}" \
            --stage "evidence=${{ needs.evidence.result }}" \
            --flow-out scrub-samples \
            --summary qa-summary.md \
            --pr-comment qa-pr-comment.md

      # The whole point: the report renders on the Actions run page.
      - name: Publish to the run summary
        run: cat qa-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Skipped for pull requests from forks, whose token is read-only.
      - name: Comment on the pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('qa-pr-comment.md', 'utf8');
            const marker = '<!-- qa-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments(
              { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(
              c => c.user && c.user.type === 'Bot' &&
                   c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }

      - name: Upload the report and the scrubbed samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-report
          path: |
            qa-summary.md
            qa-pr-comment.md
            scrub-samples/
          if-no-files-found: warn
          retention-days: 30

  # ------------------------------------------------------------------ #
  # 6. The single required status check.
  #
  # Everything above is allowed to finish so the report always publishes.
  # This job is the one that turns the run red — make it the required check in
  # the branch-protection rule and there is exactly one box to watch.
  # ------------------------------------------------------------------ #
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, coverage, evidence, report]
    if: always()
    steps:
      - name: Verdict
        env:
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.test.result }}
          COVERAGE: ${{ needs.coverage.result }}
          EVIDENCE: ${{ needs.evidence.result }}
          REPORT: ${{ needs.report.result }}
        run: |
          fail=0
          check() {
            case "$2" in
              success) echo "✅ $1" ;;
              skipped) echo "⏭️  $1 (skipped)" ;;
              *)       echo "❌ $1 ($2)"; fail=1 ;;
            esac
          }
          check "Code quality" "$LINT"
          check "Tests"        "$TESTS"
          check "Coverage"     "$COVERAGE"
          check "Evidence"     "$EVIDENCE"
          check "QA report"    "$REPORT"
          if [ "$fail" -ne 0 ]; then
            echo "::error::CI failed. The QA report on this run's summary page explains what broke, in plain language."
            exit 1
          fi
          echo "All stages green."
