name: QA

# Runs on every push to main and every pull request — the whole team sees a
# green/red check plus a rich, plain-language QA report ON THE RUN PAGE.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/harness/requirements.txt

      # System binaries the scrubber/harness shell out to (never linked).
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libimage-exiftool-perl libjpeg-turbo-progs ffmpeg lame

      # A SECOND MP3 engine. Every LAME front-end shares one engine, so without a
      # non-libmp3lame encoder the cross-engine A2 experiments (E-LAME peer set +
      # E-ENGINE) silently degrade to a same-engine set that cannot answer the
      # question. shine is small and builds directly; no autotools needed.
      - name: Build shineenc (second MP3 engine, for cross-engine A2 evidence)
        run: |
          git clone --depth 1 https://github.com/toots/shine.git /tmp/shine
          cc -O2 -I/tmp/shine/src/lib -I/tmp/shine/src/bin \
             /tmp/shine/src/lib/*.c /tmp/shine/src/bin/*.c \
             -o /tmp/shine/shineenc -lm
          sudo install -m 0755 /tmp/shine/shineenc /usr/local/bin/shineenc
          shineenc -h 2>&1 | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/harness/requirements.txt

      # Run the suite; keep going so the QA report is built even on failure
      # (people need to SEE what failed).
      - name: Run test suite
        id: tests
        continue-on-error: true
        run: python -m pytest -q --junit-xml=pytest-results.xml

      - name: Build QA report
        if: always()
        run: |
          python scripts/qa_report.py \
            --junit pytest-results.xml \
            --summary qa-summary.md \
            --flow-out scrub-samples

      # The star: the rich report renders on the Actions run page.
      - name: Publish report to run summary
        if: always()
        run: cat qa-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment report on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('qa-summary.md', 'utf8');
            const marker = '<!-- qa-report -->';
            const {owner, repo} = context.repo;
            const issue = context.issue.number;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number: issue});
            const mine = comments.data.find(c => c.body && c.body.includes(marker));
            const payload = marker + "\n" + body;
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body: payload});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: issue, body: payload});
            }

      - name: Upload scrubbed samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrubbed-samples
          path: scrub-samples/
          retention-days: 14

      # Make the check red if the suite failed (after the report is published).
      - name: Enforce test result
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo "::error::Test suite failed — see the QA report above."
          exit 1
